[project]
name = "task-orchestration"
version = "0.1.0"
description = "Task assigning and sequencing with OR-Tools CP-SAT."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ortools==9.14.6206",
    "pydantic==2.12.5",
]

[project.scripts]
task-assign = "task_orchestration.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_orchestration"]
